# Teacher exp010 F1 formal parameters, re-evaluated with today's exp008/003 code.
# No grid batches here: 5 methods x 2 sessions x 40,000 CTX per method.
label: exp011_clean_ewma

exp:
  exp008_sessions: 2
  exp008_final_arm: "topup@150.0@0.95@20.0"
  exp008_min_relay_reduction: 0.20
  exp008_max_throughput_loss: 0.15
  exp008_design_note: "Re-evaluate teacher exp010 F1 settings using current exp008/003 and ETH_cleaned.csv. Not an exact historical reproduction: current code and route seeds 7/17 differ. Hard-window epsilon=.1 versus EWMA epsilon=.95 is a selected-parameter comparison, not pure estimator ablation. Report all five methods, Relay, TDR events, transfers, Relay+transfers, throughput and integrity. No guaranteed EWMA win."

  rate: 120
  ctx_per_broker: 800
  pool_scan: 200000
  group_cap_mult: 2.0
  seed: 42
  route_seed: 7
  balances_eth: 150
  sender_window: 2
  max_backlog: 20000
  loop_sleep_s: 0.005
  release_poll_s: 0.15
  dispatch_per_tick: 200

  tdr_window_blocks: 20
  tdr_epsilon: 0.1
  tdr_q_min: 0.10
  tdr_chi_blocks: 10
  tdr_timeout_blocks: 20
  tdr_trigger_mode: excess_only
  tdr_offset_blocks: 3
  tdr_offset_spread_blocks: 5
  tdr_block_poll_s: 1.0
  tdr_cap_mult: 2.0  # Actual Valve arm explicitly overrides this to 1.3.
  tdr_base_lead_blocks: 6.0
  tdr_base_safety: 2.0
  tdr_base_floor_frac: 0.05
  tdr_ewma_half_life: 0.0  # Only the EWMA arm enables a 20-block half-life.
  tdr_target_cap: 0.0
  tdr_min_reserve_eth: 0.0
  # Deliberately omit tdr_surplus_epsilon: each arm uses its own epsilon on
  # both deficit and donor sides, as in the teacher's configuration.
  # name@fund@cap@epsilon@chi@half_life@q_min
  arms: "plain@150,valve@150@1.3,tdr@150@@0.1,topup@150@@0.1,topup@150@@0.95@@20"

  max_inflight: 24
  poll_s: 0.05
  probe_s: 0.2
  probe_first_s: 0.9
  relay_timeout_s: 120
  engine_timeout_s: 150
  t_ready_budget_s: 180
  drain_tail_s: 420
  rss_cap_mb: 9000
  # Required by current code; bridge infrastructure budget, NOT broker liquidity.
  coordinator_mint_budget_eth_per_shard: 2000000
  match_ctrl_bytes: 100

chain:
  anvil_bin: null
  mnemonic: "myth like bonus scare over problem client lizard pioneer submit female collect"
  num_shards: 16
  base_port: 8600
  chain_id_base: 43000
  block_time_s: 1
  gas_limit: 30000000
  num_funded_accounts: 450
  accounts_balance_eth: 0

scale:
  coordinator_index: 1
  broker_base_index: 100
  num_brokers: 50
  user_base_index: 200
  num_users: 200

broker:
  initial_balance_eth: 150
  relay_mint_budget_eth: 1000

traffic:
  kind: real_csv
  real_csv_path: trace/ETH_cleaned.csv
  allow_contract_endpoints: false
  value_floor_eth: 0.01
  value_cap_eth: 10.0
  max_extract: 50

b2e:
  enabled: false

tdr:
  enabled: true

output:
  results_root: results

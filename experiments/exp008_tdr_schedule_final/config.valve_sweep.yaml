# exp008 exploratory sweep: 9 Valve thresholds and 3 EWMA epsilon candidates.
# Original config.yaml is unchanged; do not run simultaneously with another exp008.
label: exp008_tdr_schedule_final

exp:
  # —— exp008 自有 ——
  exp008_sessions: 2                 # 15 arms x 2 sessions, seeds 7/17
  # —— 负载与速率（正式档标定，20260908/09）——
  rate: 120                          # 本实验 exp003 管线历史完整跑通的速率；exp007 动态路由在 120 会积压中止，不能混同
  ctx_per_broker: 800                # N = 50 × 800 = 40000
  pool_scan: 200000                  # 40000 笔需要的 trace 扫描量
  group_cap_mult: 2.0
  seed: 42
  route_seed: 7
  balances_eth: 1.5                  # 每broker每分片；部分交易超过初始余额，属于压力测试
  match_ctrl_bytes: 100              # broker 控制消息声明值；relay 由 CSV 的 RLP+回执实测字节计算
  sender_window: 8                   # 减少同发送方排队；实际吞吐仍须查看结果
  max_backlog: 20000                 # 积压安全阈值，不代表丢失容忍量；超限后该场不能作为正式结果
  loop_sleep_s: 0.005
  release_poll_s: 0.15
  dispatch_per_tick: 200
  # —— TDR 参数（定稿）——
  tdr_window_blocks: 6               # 保留旧硬窗口对照；本次不是等效窗口消融
  tdr_epsilon: 0.1                   # 基线 proportional 沿用论文值
  tdr_q_min: 0.10                    # proportional基线；硬窗token为0.30，EWMA为0.60
  tdr_chi_blocks: 2                  # 更快补货，允许每 2 块开一次事件
  tdr_timeout_blocks: 20
  tdr_trigger_mode: excess_only
  tdr_offset_blocks: 1
  tdr_offset_spread_blocks: 4        # 仍保留错峰，但缩短 EWMA 冷启动后的等待
  tdr_block_poll_s: 0.5
  tdr_cap_mult: 1.3                  # valve 恢复历史标准阈值，不使用已高度调优的 1.2
  tdr_base_lead_blocks: 6.0
  tdr_base_safety: 2.0
  tdr_base_floor_frac: 0.05
  tdr_ewma_half_life: 0.0            # 全局默认硬窗口；EWMA token指定hl=12
  tdr_target_cap: 0.20               # 抑制弱热点场景下单分片目标过度集中
  tdr_min_reserve_eth: 0.25          # 换算为有效q_min下限；在途资金会改变该下限，不是硬保证
  tdr_surplus_epsilon: 0.10          # 供钱侧：actual > 1.1 * target 即可成为 donor
  # —— 15 groups: Plain + 9 Valve + Proportional + Hard + 3 EWMA ——
  arms: "plain@1.5,valve@1.5@1.05,valve@1.5@1.1,valve@1.5@1.2,valve@1.5@1.3,valve@1.5@1.5,valve@1.5@1.7,valve@1.5@2,valve@1.5@2.5,valve@1.5@3,tdr@1.5@@0.1,topup@1.5@@0.65@2@0@0.3,topup@1.5@@0.5@2@12@0.6,topup@1.5@@0.85@2@12@0.6,topup@1.5@@0.95@2@12@0.6"
  # This study description is included in report.params.exp.
  exp008_design_note: "Exploratory sweep: report all nine Valve thresholds and three EWMA candidates. Primary Valve reference remains 1.3. EWMA epsilon=0.5 is the configured V2/V3 arm; epsilon=0.85/0.95 are cost-reduction candidates, not presumed winners. Hard-window explicitly sets half-life=0 to avoid omitted-field label ambiguity. No joint optimum or held-out validation claimed."
  # —— 引擎公共 ——
  max_inflight: 64
  poll_s: 0.05
  probe_s: 0.2
  probe_first_s: 0.9
  relay_timeout_s: 120
  engine_timeout_s: 150
  t_ready_budget_s: 180
  drain_tail_s: 420
  # 技术签发账户预算必须独立于本批 trace 总额；避免 TDR 高周转耗尽基础设施资金。
  coordinator_mint_budget_eth_per_shard: 2000000
  exp008_min_relay_reduction: 0.20
  exp008_max_throughput_loss: 0.15
  exp008_final_arm: "topup@1.5@0.5@2.0@12.0@0.6"
  rss_cap_mb: 9000

chain:
  anvil_bin: null
  mnemonic: "myth like bonus scare over problem client lizard pioneer submit female collect"
  num_shards: 16
  base_port: 8600
  chain_id_base: 43000
  block_time_s: 1
  gas_limit: 30000000
  num_funded_accounts: 450
  accounts_balance_eth: 0

scale:
  coordinator_index: 1
  broker_base_index: 100
  num_brokers: 50
  user_base_index: 200
  num_users: 200

broker:
  initial_balance_eth: 1.5
  relay_mint_budget_eth: 1000

traffic:
  kind: real_csv
  # 2026-09-24 导入的新主网交易记录；相对路径按项目根目录解析。
  real_csv_path: trace/ethereum_202509.csv
  # 新文件以合约交互为主；只取地址/方向/ETH value 作为分片负载代理，
  # 不重放 calldata 或原合约状态。其他实验默认仍为 false。
  allow_contract_endpoints: true
  value_floor_eth: 0.25              # 与cap一起过滤原始记录，不裁剪金额；会改变所选trace
  value_cap_eth: 3.0
  max_extract: 50

b2e:
  enabled: false

tdr:
  enabled: true                      # 占位说明：方案开关在 exp.arms（exp003 管线）

output:
  results_root: results

# exp035 · 用「经济目标」重调 EWMATE Top-up 的参数（对照 exp028/029 的等权 C）
#
# 问题：exp019–024 在 150 ETH 调出 eps=0.95（网格右端点），exp028/029 在 45 ETH
# 用主指标 C = Relay + TDR搬运次数（等权）复检。但费用模型
#     净收益 = F·[β·Δn_b − y],  ρ* = y/Δn_b
# 里 1 笔搬运实付 1F，而少 1 笔 relay 只值 β·F=0.1F —— 两者**不等权**，且"不做 TDR"
# 这个选项从没进过候选。本包把 plain 放进网格，用净收益/ρ* 重新排名。
#
# 体制与 exp025/exp033 发布设定逐参数相同（轮转 11/3、45 ETH/片、4万笔、route_seed 7、
# hl=20），**不动资金**，所以结论与已有 45 ETH 结果直接可比、不使其作废。
label: exp035_econ_retune
exp:
  rate: 120
  ctx_per_broker: 800
  pool_scan: 200000
  group_cap_mult: 2.0
  seed: 42
  route_seed: 7
  balances_eth: 45
  sender_window: 2
  shift_to_shard: 11
  shift_start_frac: 0.3
  shift_span_frac: 1.0
  shift_period_frac: 0.04
  shift_cycle: 11,3
  shift_avoid_same_shard: true
  shift_intensity: 1.0
  max_backlog: 40000
  loop_sleep_s: 0.005
  release_poll_s: 0.15
  dispatch_per_tick: 200
  drain_tail_s: 1800
  refresh_every_blocks: 10
  refresh_workers: 16
  max_inflight: 24
  poll_s: 0.05
  probe_s: 0.2
  probe_first_s: 0.9
  relay_timeout_s: 120
  engine_timeout_s: 150
  t_ready_budget_s: 180
  rss_cap_mb: 9000
  coord_budget_mult: 6.0
  tdr_window_blocks: 20
  tdr_epsilon: 0.1
  tdr_q_min: 0.1
  tdr_chi_blocks: 10
  tdr_timeout_blocks: 20
  tdr_trigger_mode: excess_only
  tdr_offset_blocks: 3
  tdr_block_poll_s: 1.0
  tdr_cap_mult: 2.0
  tdr_base_lead_blocks: 6.0
  tdr_base_safety: 2.0
  tdr_base_floor_frac: 0.05
  tdr_ewma_half_life: 20.0
  tdr_ewma_min_blocks: 5
  tdr_ewma_window_blocks: 0
  tdr_ewma_two_sided: false
  match_ctrl_bytes: 100
  repetitions: 1
  route_seed_step: 10
  # —— 参数网格（runner 读它生成任务，不再用 exp.arms）——
  # eps 越大触发越懒（可用余额 < (1-eps)·target 才动；eps=1 即永不触发）。
  # 0.95 = 定稿值（exp019-024 在 150 ETH 选出，恰为当时网格右端点）。
  # q_min = EWMA 目标的持仓地板比例；0.3 = 定稿值，0.1 = exp008 锚点臂的取值。
  grid:
    epsilon: [0.8, 0.95, 0.99]
    q_min: [0.1, 0.3, 0.7]
    half_life: 20.0
    include_plain: true
  formal_ctx_per_arm: 40000
  formal_rounds: 3
  # 费用模型（与 exp034 同账）：F 为每笔 CTX 手续费，beta 为平台抽成。
  fee_beta: 0.1
  b2e_fee_share: 0.1
chain:
  anvil_bin: null
  mnemonic: myth like bonus scare over problem client lizard pioneer submit female
    collect
  num_shards: 16
  base_port: 8600
  chain_id_base: 43000
  block_time_s: 1
  gas_limit: 30000000
  num_funded_accounts: 450
  accounts_balance_eth: 0
scale:
  coordinator_index: 1
  broker_base_index: 100
  num_brokers: 50
  user_base_index: 200
  num_users: 200
broker:
  initial_balance_eth: 45
  relay_mint_budget_eth: 1000
traffic:
  kind: real_csv
  real_csv_path: trace/ETH_cleaned.csv
  allow_contract_endpoints: false
  value_floor_eth: 0.01
  value_cap_eth: 10.0
  max_extract: 50
tdr:
  enabled: true
  trigger_mode: excess_only
  window_blocks: 10
  epsilon: 0.1
  q_min: 0.1
  chi_blocks: 5
  timeout_blocks: 5
b2e:
  enabled: false
  fee_share: 0.1
  gas_units_per_ctx: 21000
  ref_gas_price_wei: 1000000000
  charges_rebalancing: false
output:
  results_root: results

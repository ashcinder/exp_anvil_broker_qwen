# exp010 · TDR/EWMA brute-force parameter search
# Execution and ledger semantics are inherited from exp003; the baseline values
# below are a pressure-test point calibrated on 1,000 CTX. The old 5 ETH,
# 12-block setup produced zero Plain relay and could not distinguish policies.
label: exp010_tdr_parameter_search

exp:
  rate: 120
  ctx_per_broker: 200
  pool_scan: 200000
  group_cap_mult: 2.0
  seed: 42
  route_seed: 7
  balances_eth: 1
  match_ctrl_bytes: 100
  sender_window: 8
  max_backlog: 20000
  loop_sleep_s: 0.002
  release_poll_s: 0.02
  dispatch_per_tick: 500

  tdr_window_blocks: 4
  tdr_epsilon: 0.1
  tdr_q_min: 0.10
  tdr_chi_blocks: 2
  tdr_timeout_blocks: 20
  tdr_trigger_mode: excess_only
  tdr_offset_blocks: 1
  tdr_offset_spread_blocks: 4
  tdr_block_poll_s: 0.5
  tdr_cap_mult: 1.3
  tdr_base_lead_blocks: 6.0
  tdr_base_safety: 2.0
  tdr_base_floor_frac: 0.05
  tdr_ewma_half_life: 0.0
  tdr_target_cap: 0.20
  # Keep the absolute reserve below the 1 ETH starting balance. A 4 ETH
  # reserve would force effective q_min=1 and erase EWMA's demand allocation.
  tdr_min_reserve_eth: 0.25
  tdr_surplus_epsilon: 0.10

  # Tokens are regenerated for every search trial. This value is only a valid
  # standalone fallback and documents the five comparison roles.
  arms: "plain@1,valve@1@1.3,tdr@1@@0.1,topup@1@@0.2@2,topup@1@@0.5@2@4@0.2"

  max_inflight: 64
  poll_s: 0.02
  probe_s: 0.1
  probe_first_s: 0.6
  relay_timeout_s: 120
  engine_timeout_s: 150
  t_ready_budget_s: 180
  drain_tail_s: 420
  coordinator_mint_budget_eth_per_shard: 2000000
  rss_cap_mb: 9000

  # exp010 driver defaults. CLI flags override these without modifying YAML.
  # Default brute-force profile: 50 brokers x 20 CTX = 1,000 CTX/arm.
  # `smoke` remains available explicitly for a fast wiring check.
  exp010_profile: search
  exp010_replicates: 1
  exp010_proportional_epsilon: 0.10
  exp010_hard_epsilon: 0.20
  exp010_hard_chi_blocks: 2
  exp010_ewma_epsilon: 0.50
  exp010_ewma_chi_blocks: 2
  exp010_ewma_half_life: 4
  exp010_ewma_q_min: 0.20

chain:
  anvil_bin: null
  mnemonic: "myth like bonus scare over problem client lizard pioneer submit female collect"
  num_shards: 16
  base_port: 8800
  chain_id_base: 44000
  block_time_s: 1
  gas_limit: 30000000
  num_funded_accounts: 450
  accounts_balance_eth: 0

scale:
  coordinator_index: 1
  broker_base_index: 100
  num_brokers: 50
  user_base_index: 200
  num_users: 200

broker:
  initial_balance_eth: 1
  relay_mint_budget_eth: 1000

traffic:
  kind: real_csv
  real_csv_path: trace/ethereum_202509.csv
  allow_contract_endpoints: true
  value_floor_eth: 0.25
  value_cap_eth: 3.0
  max_extract: 50

b2e:
  enabled: false

tdr:
  enabled: true

output:
  results_root: results

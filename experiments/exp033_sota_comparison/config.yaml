# exp033 · SOTA 再平衡方案对照（Pareto：relay × 搬运次数）
#
# 与 exp025 逐参数相同（同 40000 CTX、同 16 分片 × 50 broker、同 route_seed
# 序列 7/17/27、同 regime-shift 负载、同资金 45 ETH），只换 exp.arms：
# 保证每个 SOTA 点与已发表的 plain/TDR 点落在同一条负载上，可直接比。
# 臂的决策规则见 brokerlab/sota_policies.py；设计依据见 SOTA_COMPARISON_DESIGN.md。
label: exp033_sota_comparison
exp:
  rate: 120
  ctx_per_broker: 800
  pool_scan: 200000
  group_cap_mult: 2.0
  seed: 42
  route_seed: 7
  balances_eth: 45
  sender_window: 2
  shift_to_shard: 11
  shift_start_frac: 0.3
  shift_span_frac: 1.0
  shift_period_frac: 0.04
  shift_cycle: 11,3
  shift_avoid_same_shard: true
  shift_intensity: 1.0
  max_backlog: 40000
  loop_sleep_s: 0.005
  release_poll_s: 0.15
  dispatch_per_tick: 200
  drain_tail_s: 1800
  refresh_every_blocks: 10
  refresh_workers: 16
  max_inflight: 24
  poll_s: 0.05
  probe_s: 0.2
  probe_first_s: 0.9
  relay_timeout_s: 120
  engine_timeout_s: 150
  t_ready_budget_s: 180
  rss_cap_mb: 9000
  coord_budget_mult: 6.0
  tdr_window_blocks: 20
  tdr_epsilon: 0.1
  tdr_q_min: 0.1
  tdr_chi_blocks: 10
  tdr_timeout_blocks: 20
  tdr_trigger_mode: excess_only
  tdr_offset_blocks: 3
  tdr_block_poll_s: 1.0
  tdr_cap_mult: 2.0
  tdr_base_lead_blocks: 6.0
  tdr_base_safety: 2.0
  tdr_base_floor_frac: 0.05
  # 所有臂共用同一需求估计器：EWMA hl=20（= TDR 定稿臂的估计器），
  # loopmax 的 Â_net / overpass 与 pnps 的 λ 都取它，避免"估计器不同"混淆归因。
  tdr_ewma_half_life: 20.0
  arms: >-
    plain@45,topup@45@@0.95@@20@0.3,flexichain@45,loopmax@45@@0.0@@20@0.0,spider@45,pnps@45,autoloop@45,overpass_u@45@@0.0,overpass_d@45@@0.0,ucrb@45
  tdr_ewma_min_blocks: 5
  tdr_ewma_window_blocks: 0
  tdr_ewma_two_sided: false
  # —— SOTA 对照臂旋钮（只在对应 policy 下被读取）——
  # spider：流水触发阈值 = 倍数 × 该 broker 总资本 (n×C)。
  # 文献原值"每 10,000e 均衡一次"的绝对单位与本平台不可比，按资本比例换算。
  sota_spider_vol_mult: 0.25
  # autoloop：余额穿 [0.3C, 0.7C] 才动，目标 = band 中点 0.5C（文献默认值）。
  sota_autoloop_low: 0.3
  sota_autoloop_high: 0.7
  # loopmax：horizon = 0 ⇒ 用 window+chi 块（= T_check + T_conf 的等价物）；
  # 安全边际 = 3 块（文献 2 分钟流量 / 20 分钟 horizon ≈ 0.1×30 块）。
  sota_loopmax_horizon_blocks: 0.0
  sota_loopmax_safety_blocks: 3.0
  match_ctrl_bytes: 100
  repetitions: 3
  route_seed_step: 10
  plotting_script: experiments/exp033_sota_comparison/plot_pareto.py
chain:
  anvil_bin: null
  mnemonic: myth like bonus scare over problem client lizard pioneer submit female
    collect
  num_shards: 16
  base_port: 8600
  chain_id_base: 43000
  block_time_s: 1
  gas_limit: 30000000
  num_funded_accounts: 450
  accounts_balance_eth: 0
scale:
  coordinator_index: 1
  broker_base_index: 100
  num_brokers: 50
  user_base_index: 200
  num_users: 200
broker:
  initial_balance_eth: 45
  relay_mint_budget_eth: 1000
traffic:
  kind: real_csv
  real_csv_path: trace/ETH_cleaned.csv
  allow_contract_endpoints: false
  value_floor_eth: 0.01
  value_cap_eth: 10.0
  max_extract: 50
tdr:
  enabled: true
  trigger_mode: excess_only
  window_blocks: 10
  epsilon: 0.1
  q_min: 0.1
  chi_blocks: 5
  timeout_blocks: 5
b2e:
  enabled: false
  fee_share: 0.1
  gas_units_per_ctx: 21000
  ref_gas_price_wei: 1000000000
  charges_rebalancing: false
output:
  results_root: results

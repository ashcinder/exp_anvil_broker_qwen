# ══════════════════════════════════════════════════════════════════════════
# exp010 · 定稿方法参数网格全量搜索（编排器；不改其它包）
# 每个批次 = 一组同场方案 + 重复场数。产物目录名带批次 id 与场次。
# 口径两套：
#   formal  正式档：16 分片 × 150/片 × 40000 笔 × rate120 × backlog20000
#   matrix  矩阵档：16 分片 × 37.5/片 × 10000 笔 × rate120（正式档的 1/4
#           标定版，紧张度守恒，exp003 档案 §12-13 口径）
# 臂 token 语法（exp003/008）：name@fund@cap@eps@chi@hl@qmin，省略位留空。
# ══════════════════════════════════════════════════════════════════════════
label: exp010_param_grid

exp:
  # —— 两套口径的 --set 覆盖表 ——
  scale_formal:
    - chain.num_shards=16
    - exp.rate=120
    - exp.ctx_per_broker=800
    - exp.pool_scan=200000
    - exp.balances_eth=150
    - exp.max_backlog=20000
  scale_matrix:
    - chain.num_shards=16
    - exp.rate=120
    - exp.ctx_per_broker=200
    - exp.pool_scan=50000
    - exp.balances_eth=150          # 每臂的 fund 由 token 覆盖为 37.5
    - exp.max_backlog=20000

  # —— 批次表：id | scale | arms | reps ——
  batches:
    F1_main_table_refresh:
      scale: formal
      reps: 2
      arms:
        - plain@150
        - valve@150@1.3
        - tdr@150@@0.1
        - topup@150@@0.1
        - topup@150@@0.95@@20
    D1_eps_x_estimator:
      scale: formal
      reps: 3
      arms:
        - topup@150@@0.1
        - topup@150@@0.1@@20
        - topup@150@@0.6
        - topup@150@@0.6@@20
        - topup@150@@0.95
        - topup@150@@0.95@@20
    A1_eps_grid_matrix:
      scale: matrix
      reps: 3
      arms:
        - topup@37.5@@0.10@@20
        - topup@37.5@@0.15@@20
        - topup@37.5@@0.20@@20
        - topup@37.5@@0.25@@20
        - topup@37.5@@0.30@@20
        - topup@37.5@@0.35@@20
        - topup@37.5@@0.40@@20
        - topup@37.5@@0.45@@20
        - topup@37.5@@0.50@@20
        - topup@37.5@@0.55@@20
        - topup@37.5@@0.60@@20
        - topup@37.5@@0.65@@20
        - topup@37.5@@0.70@@20
        - topup@37.5@@0.75@@20
        - topup@37.5@@0.80@@20
        - topup@37.5@@0.85@@20
        - topup@37.5@@0.90@@20
        - topup@37.5@@0.95@@20
        - topup@37.5@@1.0@@20      # 悬崖对照点
    B1_qmin_grid:
      scale: matrix
      reps: 3
      arms:
        - topup@37.5@@0.95@@20@0
        - topup@37.5@@0.95@@20@0.025
        - topup@37.5@@0.95@@20@0.05
        - topup@37.5@@0.95@@20@0.10
        - topup@37.5@@0.95@@20@0.15
        - topup@37.5@@0.95@@20@0.20
    C1_hl_outer:
      scale: matrix
      reps: 3
      arms:
        - topup@37.5@@0.95@@4
        - topup@37.5@@0.95@@6
        - topup@37.5@@0.95@@60
    G1_final_stability:
      scale: formal
      reps: 3
      arms:
        - topup@150@@0.95@@20

  # —— 转发给 exp003 管线的策略公共参数（全批次一致）——
  tdr_window_blocks: 20
  tdr_epsilon: 0.1
  tdr_q_min: 0.10
  tdr_chi_blocks: 10
  tdr_timeout_blocks: 20
  tdr_trigger_mode: excess_only
  tdr_offset_blocks: 3
  tdr_block_poll_s: 1.0
  tdr_cap_mult: 2.0
  tdr_base_lead_blocks: 6.0
  tdr_base_safety: 2.0
  tdr_base_floor_frac: 0.05
  tdr_ewma_half_life: 0.0          # 默认硬窗；EWMA 由 token 的 hl 段开启
  # —— 引擎公共 ——
  ctx_per_broker: 200
  group_cap_mult: 2.0
  seed: 42                          # 全部批次冻结：噪声=时序竞态，非流差异
  route_seed: 7
  balances_eth: 150
  sender_window: 2
  max_backlog: 20000
  loop_sleep_s: 0.005
  release_poll_s: 0.15
  dispatch_per_tick: 200
  rate: 120
  arms: "plain@150"
  max_inflight: 24
  poll_s: 0.05
  probe_s: 0.2
  probe_first_s: 0.9
  relay_timeout_s: 120
  engine_timeout_s: 150
  t_ready_budget_s: 180
  drain_tail_s: 420
  coord_budget_mult: 6.0
  rss_cap_mb: 9000

chain:
  anvil_bin: null
  mnemonic: "myth like bonus scare over problem client lizard pioneer submit female collect"
  num_shards: 16
  base_port: 8600
  chain_id_base: 43000
  block_time_s: 1
  gas_limit: 30000000
  num_funded_accounts: 450
  accounts_balance_eth: 0

scale:
  coordinator_index: 1
  broker_base_index: 100
  num_brokers: 50
  user_base_index: 200
  num_users: 200

broker:
  initial_balance_eth: 150
  relay_mint_budget_eth: 1000

traffic:
  kind: real_csv
  real_csv_path: null
  value_floor_eth: 0.01
  value_cap_eth: 10.0
  max_extract: 50

b2e:
  enabled: false

tdr:
  enabled: true

output:
  results_root: results

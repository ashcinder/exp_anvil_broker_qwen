[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brokerlab"
version = "0.1.0"
description = "BrokerChain/TDR sharding testbed on Anvil — ground-up refactor (exp_anvil_broker_qwen)"
requires-python = ">=3.11"
dependencies = [
  "web3>=7.16,<8",
  "requests>=2.31,<3",
  "eth-account>=0.13,<0.14",
  "PyYAML>=6.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["brokerlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["backups", "tmp", "out", "out_*", ".git", ".pytest_cache"]
